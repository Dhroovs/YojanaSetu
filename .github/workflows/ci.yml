name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8.0
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
      LLM_PROVIDER: none
      ALLOW_HOSTED_LLM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock.txt}
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m ruff check backend/app backend/tests backend/scripts
      - run: python -m ruff format --check backend/app backend/tests backend/scripts
      - run: python -m pytest backend/tests -q
      - run: python -m pip check
      - run: python backend/scripts/dependency_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-security-audit, path: artifacts/python-security-audit.json}
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: python3 backend/scripts/verify_container_runtime.py
      - run: docker compose down --remove-orphans
        if: always()
